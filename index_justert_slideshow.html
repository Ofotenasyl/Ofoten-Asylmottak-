<!doctype html><html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Corvita – Ofoten Asylmottak</title>
<style>
:root{--red:#d7193f;--navy:#123a67;--ink:#1f2933;--muted:#66717c;--bg:#f6f5f2;--line:#e7e3df;--warm:#fff8ee}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--ink)}.screen{width:100vw;height:100vh;padding:1.8vh 1.6vw 1.1vh;display:grid;grid-template-rows:10.5vh 1fr 12.5vh 5.2vh;gap:1.35vh}header{display:grid;grid-template-columns:1.25fr .95fr .6fr;align-items:center;border-bottom:.35vh solid var(--red);padding-bottom:.8vh}.brand{display:flex;align-items:center;gap:1vw}.logo{height:7vh;max-width:25vw;object-fit:contain}.site-name{border-left:.13vw solid #cfd4d9;padding-left:1vw;color:var(--navy);font-weight:800;font-size:2.25vh;line-height:1.05}.tagline{text-align:center;color:var(--red);font-size:2.15vh;font-style:italic;font-weight:700}.datetime{text-align:right}.date{font-size:1.65vh;font-weight:700;color:var(--navy)}.time{font-size:5vh;line-height:1;font-weight:900;color:var(--red)}main{min-height:0;display:grid;grid-template-columns:1.45fr 1fr;gap:1.3vw}.card{background:#fff;border:1px solid var(--line);border-radius:1vw;overflow:hidden}.slideshow{position:relative;min-height:0;background:#eee}.slide{position:absolute;inset:0;opacity:0;transition:opacity .9s;background:#fff;display:flex;align-items:center;justify-content:center}.slide.active{opacity:1;z-index:2}.slide img{width:100%;height:100%;object-fit:contain;background:#f7f4ef}.activities{display:grid;grid-template-rows:auto 1fr}.section-head{background:var(--red);color:#fff;padding:1.15vh 1vw;font-size:2.05vh;font-weight:900}.activity-list{padding:.65vh .85vw .85vh;display:grid;align-content:start;gap:.65vh}.activity{display:grid;grid-template-columns:5.3vw 1fr auto;gap:.85vw;align-items:center;padding:.85vh .55vw;border:1px solid var(--line);border-radius:.8vw;background:#fff}.calendar{width:5.3vw;border-radius:.7vw;overflow:hidden;border:1px solid #e1d5d8;background:#fff}.calendar-month{background:var(--red);color:#fff;text-transform:uppercase;text-align:center;font-size:1.05vh;font-weight:900;letter-spacing:.08em;padding:.42vh .2vw}.calendar-day{text-align:center;color:var(--navy);font-size:2.45vh;font-weight:900;line-height:1;padding:.72vh .15vw .3vh}.calendar-weekday{text-align:center;color:var(--muted);font-size:.95vh;font-weight:700;padding-bottom:.45vh}.name{color:var(--navy);font-size:1.58vh;font-weight:900}.place{color:var(--muted);font-size:1.18vh;margin-top:.32vh}.time-badge{display:inline-block;background:#f5f7f9;border-radius:999px;padding:.5vh .65vw;font-weight:800;color:var(--navy);font-size:1.2vh}.important{display:grid;grid-template-columns:12vw 1fr;align-items:center;background:var(--warm);border:1px solid #eed6a6;border-radius:.9vw;overflow:hidden}.important-title{height:100%;display:flex;align-items:center;justify-content:center;background:#fff0ce;color:var(--navy);text-align:center;font-size:1.95vh;font-weight:900}.important-text{padding:1.2vh 1.25vw;font-size:1.9vh;line-height:1.34}footer{background:var(--red);color:#fff;border-radius:.7vw;display:grid;grid-template-columns:1fr 1fr 1fr;align-items:center;padding:0 1.1vw;font-size:1.32vh}footer div:nth-child(2){text-align:center}footer div:nth-child(3){text-align:right}
</style></head><body><div class="screen"><header><div class="brand"><img class="logo" src="corvita-logo.png"><div class="site-name">Ofoten<br>Asylmottak</div></div><div class="tagline">En meningsfylt hverdag</div><div class="datetime"><div class="date" id="date"></div><div class="time" id="time"></div></div></header><main><section class="card slideshow" id="slideshow"></section><section class="card activities"><div class="section-head">KOMMENDE AKTIVITETER</div><div class="activity-list" id="activityList"></div></section></main><section class="important"><div class="important-title">VIKTIG<br>INFORMASJON</div><div class="important-text">Detaljert informasjon om aktiviteter og påmeldingsliste finnes i hovedbygget ved inngangen på tavlen.</div></section><footer><div>Infoskjerm • Ofoten Asylmottak</div><div>Corvita</div><div>Oppdateres fortløpende</div></footer></div>
<script>
const months=["JAN","FEB","MAR","APR","MAI","JUN","JUL","AUG","SEP","OKT","NOV","DES"],weekdays=["søndag","mandag","tirsdag","onsdag","torsdag","fredag","lørdag"];
function pd(s){const p=s.split(".");if(p.length<3)return null;const d=new Date(+p[2],+p[1]-1,+p[0]);return isNaN(d)?null:d}
function cp(s){const d=pd(s);return d?{day:String(d.getDate()).padStart(2,"0"),month:months[d.getMonth()],weekday:weekdays[d.getDay()]}:{day:s,month:"",weekday:""}}
async function acts(){try{const r=await fetch("aktiviteter.json?v="+Date.now(),{cache:"no-store"}),data=await r.json(),t=new Date();t.setHours(0,0,0,0);const list=data.map(a=>({...a,_d:pd(a.dato)})).filter(a=>a._d&&a._d>=t).sort((a,b)=>a._d-b._d).slice(0,5),el=document.getElementById("activityList");el.innerHTML=list.length?list.map(a=>{const c=cp(a.dato);return `<div class="activity"><div class="calendar"><div class="calendar-month">${c.month}</div><div class="calendar-day">${c.day}</div><div class="calendar-weekday">${c.weekday}</div></div><div><div class="name">${a.tittel}</div><div class="place">Oppmøtested: ${a.oppmote}</div></div><div><span class="time-badge">Kl. ${a.klokkeslett}</span></div></div>`}).join(""):'<div style="padding:2vh 1vw;color:#66717c">Ingen kommende aktiviteter er registrert.</div>'}catch(e){}}
let slides=[],i=0,lastFiles="";
async function imgs(){
  try{
    const r=await fetch("bilder.json?v="+Date.now(),{cache:"no-store"});
    const files=await r.json();
    const signature=JSON.stringify(files);
    if(signature===lastFiles) return;
    lastFiles=signature;

    const box=document.getElementById("slideshow");
    box.innerHTML=files.map((f,j)=>{
      const overlay=f==="bygg.jpg"
        ? `<div class="overlay"><div class="title">Velkommen til Ofoten Asylmottak</div><div class="sub">Aktuell informasjon og aktiviteter vises her.</div></div>`
        : "";
      return `<div class="slide${j===0?" active":""}"><img src="${f}">${overlay}</div>`;
    }).join("");
    slides=[...box.querySelectorAll(".slide")];
    i=0;
  }catch(e){}
}
function rot(){if(slides.length<2)return;slides[i].classList.remove("active");i=(i+1)%slides.length;slides[i].classList.add("active")}function clk(){const n=new Date();time.textContent=n.toLocaleTimeString("nb-NO",{hour:"2-digit",minute:"2-digit"});date.textContent=n.toLocaleDateString("nb-NO",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}
imgs();acts();clk();setInterval(clk,1000);setInterval(rot,12000);setInterval(acts,60000);setInterval(imgs,60000);
</script></body></html>
